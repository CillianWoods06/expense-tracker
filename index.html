<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Student Budget Tracker</h1>
      <label class="month-picker">
        Month
        <input id="month" type="month">
      </label>
    </header>

    <section class="cards">
      <div class="card"><span>Spent this month</span><strong id="spent">€0.00</strong></div>
      <div class="card"><span>Budget left</span><strong id="remaining">€0.00</strong></div>
      <div class="card"><span>Biggest category</span><strong id="top-category">–</strong></div>
    </section>

    <section class="budget">
      <form id="budget-form">
        <label for="budget">Monthly budget (€)</label>
        <input id="budget" type="number" min="0" step="1">
        <button type="submit">Set</button>
      </form>
      <div class="bar"><div id="bar-fill"></div></div>
      <p id="budget-message"></p>
    </section>

    <section class="panel">
      <h2>Add an expense</h2>
      <form id="expense-form">
        <input id="description" type="text" placeholder="Description" maxlength="60" required>
        <input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount (€)" required>
        <input id="date" type="date" required>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Rent</option>
          <option>College</option>
          <option>Social</option>
          <option>Other</option>
        </select>
        <button type="submit">Add</button>
      </form>
      <p id="error" class="error" hidden></p>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>Spending by category</h2>
        <canvas id="chart" height="220"></canvas>
        <p id="chart-empty" class="muted">No expenses this month yet.</p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Expenses</h2>
          <button id="export" class="secondary">Export CSV</button>
        </div>
        <table>
          <thead>
            <tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th><th></th></tr>
          </thead>
          <tbody id="expense-rows"></tbody>
        </table>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
